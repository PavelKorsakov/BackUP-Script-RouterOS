name: Publish MikroTik Backup Script v2.3.1

on:
  push:
    paths:
      - '.github/workflows/publish-v2.3.1.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      TARGET_COMMIT: a1b4130a1ad4120f61a0c8d1e1127058471a97cf
      TAG_NAME: v2.3.1
      VERSION: 2.3.1
      EXPECTED_RUNTIME_SHA256: a5b2bd3aed3701afc6c71cb3ce5c4768b2b4f41c934e4025eaba2f89c375dbd8
      EXPECTED_SUMS_SHA256: be135330555a3c5daeb892e34412d15ddb92c4f84ed67a63b236af2e61756055
      EXPECTED_ZIP_SHA256: 1d8e29ebf69ac20d979c0e3acd968f3444abdfaa978c7934d08c370884649f87

    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight exact publication target
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${TARGET_COMMIT}^{commit}"
          [[ "$(git rev-parse "${TARGET_COMMIT}^{tree}")" == "ef5fa8196d3b1c16038662568e35f549f0733bda" ]]
          [[ -z "$(git ls-remote --tags origin "refs/tags/${TAG_NAME}")" ]]
          count="$(git ls-tree -r --name-only "$TARGET_COMMIT" | wc -l | tr -d '[:space:]')"
          [[ "$count" == "150" ]]
          sha="$(git show "${TARGET_COMMIT}:mikrotik-backup.sh" | sha256sum | awk '{print $1}')"
          [[ "$sha" == "$EXPECTED_RUNTIME_SHA256" ]]

      - name: Build and verify release assets
        shell: bash
        run: |
          set -euo pipefail

          ROOT=/tmp/mikrotik-v2.3.1
          PUBLIC="$ROOT/public"
          PACKAGE="$ROOT/package"
          RELEASE="$ROOT/release"
          VERIFY="$ROOT/verify"

          mkdir -p "$PUBLIC" "$PACKAGE" "$RELEASE" "$VERIFY"
          git archive "$TARGET_COMMIT" | tar -xf - -C "$PUBLIC"

          [[ "$(find "$PUBLIC" -type f | wc -l | tr -d '[:space:]')" == "150" ]]
          [[ ! -e "$PUBLIC/.github" ]]

          cp -- "$PUBLIC/mikrotik-backup.sh" "$RELEASE/mikrotik-backup.sh"
          chmod 0755 -- "$RELEASE/mikrotik-backup.sh"
          printf '%s  %s\n' "$EXPECTED_RUNTIME_SHA256" 'mikrotik-backup.sh' >"$RELEASE/SHA256SUMS"

          cp -a -- "$PUBLIC/." "$PACKAGE/"
          cp -- "$RELEASE/SHA256SUMS" "$PACKAGE/SHA256SUMS"

          find "$PACKAGE" -type f ! -name 'mikrotik-backup.sh' -exec chmod 0644 -- {} +
          chmod 0755 -- "$PACKAGE/mikrotik-backup.sh"
          while IFS= read -r -d '' file; do
            TZ=UTC touch -t 198001010000 -- "$file"
          done < <(find "$PACKAGE" -type f -print0)

          ZIP="$RELEASE/mikrotik-backup-${VERSION}.zip"
          (
            cd "$PACKAGE"
            find . -type f -printf '%P\n' | LC_ALL=C sort | zip -X -q "$ZIP" -@
          )

          [[ "$(unzip -Z1 "$ZIP" | wc -l | tr -d '[:space:]')" == "151" ]]
          unzip -tq "$ZIP" >/dev/null
          unzip -q "$ZIP" -d "$VERIFY"
          (
            cd "$VERIFY"
            sha256sum --check SHA256SUMS >/dev/null
          )

          [[ "$(sha256sum "$RELEASE/mikrotik-backup.sh" | awk '{print $1}')" == "$EXPECTED_RUNTIME_SHA256" ]]
          [[ "$(sha256sum "$RELEASE/SHA256SUMS" | awk '{print $1}')" == "$EXPECTED_SUMS_SHA256" ]]
          [[ "$(sha256sum "$ZIP" | awk '{print $1}')" == "$EXPECTED_ZIP_SHA256" ]]

      - name: Prepare public release notes
        shell: bash
        run: |
          cat >/tmp/release-notes.md <<'EOF'
          # MikroTik Backup Script 2.3.1

          Version 2.3.1 is a maintenance and hotfix release following 2.3.0.

          ## Highlights

          - Added the canonical boolean `UseIncremental` setting. When disabled, post-backup comparison and incremental retention are skipped and every successfully validated new artifact is retained.
          - Corrected MonthlyArchive calendar ordering and hardened archive metadata handling for qualified network storage while preserving strict checks for local filesystems.
          - Improved the Configuration Editor and BackUP Master viewport for shorter terminals.
          - Added external runtime translations for German, Spanish, Latvian, Polish, and Ukrainian.
          - Added the complete canonical 245-key `en.lang` translation template.
          - Published user documentation in 11 languages.
          - Notifications remain outside the scope of this release.

          ## Assets

          - `mikrotik-backup.sh` — standalone script.
          - `SHA256SUMS` — checksum for the standalone script.
          - `mikrotik-backup-2.3.1.zip` — complete package with the script, documentation, localization files, and checksum.

          See the repository documentation for installation, configuration, security, and release verification.
          EOF

      - name: Create annotated tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cleanup_on_error() {
            status=$?
            if [[ $status -ne 0 ]]; then
              gh release delete "$TAG_NAME" --yes --cleanup-tag >/dev/null 2>&1 || true
              git push origin ":refs/tags/$TAG_NAME" >/dev/null 2>&1 || true
            fi
            exit "$status"
          }
          trap cleanup_on_error EXIT

          git config user.name "Pavel Korsakov"
          git config user.email "97290655+PavelKorsakov@users.noreply.github.com"
          git tag -a "$TAG_NAME" "$TARGET_COMMIT" -m "MikroTik Backup Script 2.3.1"
          git push origin "refs/tags/$TAG_NAME"

          gh release create "$TAG_NAME"             "/tmp/mikrotik-v2.3.1/release/mikrotik-backup.sh"             "/tmp/mikrotik-v2.3.1/release/SHA256SUMS"             "/tmp/mikrotik-v2.3.1/release/mikrotik-backup-2.3.1.zip"             --verify-tag             --title "MikroTik Backup Script 2.3.1"             --notes-file /tmp/release-notes.md             --latest

          trap - EXIT

      - name: Postflight published objects
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"
          [[ "$(git rev-list -n 1 "$TAG_NAME")" == "$TARGET_COMMIT" ]]

          gh release view "$TAG_NAME"             --json tagName,name,isDraft,isPrerelease             --jq '
              .tagName == "v2.3.1" and
              .name == "MikroTik Backup Script 2.3.1" and
              (.isDraft | not) and
              (.isPrerelease | not)
            ' | grep -Fx true

          mkdir -p /tmp/published-assets
          gh release download "$TAG_NAME" --dir /tmp/published-assets

          [[ "$(find /tmp/published-assets -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" == "3" ]]
          [[ "$(sha256sum /tmp/published-assets/mikrotik-backup.sh | awk '{print $1}')" == "$EXPECTED_RUNTIME_SHA256" ]]
          [[ "$(sha256sum /tmp/published-assets/SHA256SUMS | awk '{print $1}')" == "$EXPECTED_SUMS_SHA256" ]]
          [[ "$(sha256sum /tmp/published-assets/mikrotik-backup-2.3.1.zip | awk '{print $1}')" == "$EXPECTED_ZIP_SHA256" ]]

          unzip -tq /tmp/published-assets/mikrotik-backup-2.3.1.zip >/dev/null
          [[ "$(unzip -Z1 /tmp/published-assets/mikrotik-backup-2.3.1.zip | wc -l | tr -d '[:space:]')" == "151" ]]
